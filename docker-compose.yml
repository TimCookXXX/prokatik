# Имя проекта задано явно, иначе compose берёт его из имени каталога — и
# переименование папки молча создаёт новые пустые тома вместо существующих.
name: inrenta

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      # Нужна Caddy для img-src в CSP: часть картинок отдаётся прямыми <img>
      # мимо next/image, то есть прямо с домена хранилища.
      - STORAGE_PUBLIC_BASE=${STORAGE_PUBLIC_BASE}
    depends_on: [app, realtime]

  app:
    build:
      context: .
      # target обязателен с появлением стадий realtime: без него compose
      # собирает ПОСЛЕДНЮЮ стадию Dockerfile, и перестановка стадий молча
      # превратила бы app в realtime-образ.
      target: runner
      args:
        STORAGE_PUBLIC_BASE: ${STORAGE_PUBLIC_BASE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/app
      # Без неё контейнер живёт в UTC, и моменты времени в интерфейсе — срок
      # заявки, время сообщений — показываются на три часа раньше.
      # toLocaleString берёт зону процесса, а не хоста. Календарный день от
      # неё не зависит: он считается в Europe/Moscow независимо от TZ,
      # см. docs/decisions/0013-single-business-timezone.md.
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: в контейнере localhost резолвится в ::1, а
      # Next слушает только IPv4 (0.0.0.0) — проверка получала Connection
      # refused при живом приложении.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Доставка в реальном времени. Порт наружу НЕ публикуется намеренно: сервис
  # доверяет заголовку X-Forwarded-For, и снаружи лимит на IP обходился бы одной
  # строкой заголовка. Дотянуться может только Caddy из этой сети.
  realtime:
    build:
      context: .
      target: realtime
    restart: unless-stopped
    # Без env_file: процессу нужны ровно две переменные, а .env несёт секреты
    # почты, S3 и NEXTAUTH_SECRET — расширять поверхность утечки незачем.
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/app
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_ENV: production
      REALTIME_PORT: 3100
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Отдаёт 503, когда слушатель LISTEN протух: half-open TCP иначе не
      # отличить от рабочего состояния. Сам по себе healthcheck контейнер не
      # перезапускает — это делает process.exit(1) внутри процесса.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
    entrypoint: ["sh", "/backup-entrypoint.sh"]
    depends_on: [db]

  # --- Только для локальной разработки -------------------------------------
  # Профиль `dev` не активируется сам: на проде `docker compose up -d` эти два
  # сервиса не трогает вовсе. Локально — `pnpm dev:up` (см. package.json).
  #
  # MinIO подменяет собой оба бакета Timeweb, чтобы локально можно было
  # проверить загрузку картинок и прогнать учения по бэкапу. Подробности и
  # значения для .env — в docs/testing.md.

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # веб-консоль, minioadmin / minioadmin
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Разовая инициализация бакетов: отрабатывает и завершается, повторный
  # запуск идемпотентен.
  minio-init:
    image: minio/mc:latest
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/inrenta-media &&
      mc mb --ignore-existing local/inrenta-backups &&
      mc anonymous set download local/inrenta-media &&
      echo '[init] buckets ready: inrenta-media (public read), inrenta-backups (private)'
      "

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  minio_data:
